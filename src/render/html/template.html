<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagraph</title>
<script>
  // Applied before first paint so a stored theme choice doesn't flash the other theme.
  try {
    var t = localStorage.getItem("diagraph:theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root {
    --ink: #14181c;
    --muted: #5b6560;
    --paper: #eff1ee;
    --panel: #f7f8f6;
    --surface: #ffffff;
    --line: #c7ccc6;
    --accent: #2f6f5e;
    --accent-soft: #dceae4;
    --legend-bg: rgba(247, 248, 246, 0.94);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
    --inv-zoom: 1;
  }

  /* Follows the OS preference by default; the toolbar toggle pins an explicit
     choice via [data-theme], which always wins over prefers-color-scheme. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e7ece8;
      --muted: #90a099;
      --paper: #121613;
      --panel: #1a201c;
      --surface: #212824;
      --line: #333e37;
      --accent: #6cc6a6;
      --accent-soft: #1e352c;
      --legend-bg: rgba(26, 32, 28, 0.94);
    }
  }
  :root[data-theme="dark"] {
    --ink: #e7ece8;
    --muted: #90a099;
    --paper: #121613;
    --panel: #1a201c;
    --surface: #212824;
    --line: #333e37;
    --accent: #6cc6a6;
    --accent-soft: #1e352c;
    --legend-bg: rgba(26, 32, 28, 0.94);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  button, input { font-family: inherit; }

  #app { position: absolute; inset: 0; overflow: hidden; }

  #toolbar {
    position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 20;
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #brand { font-weight: 600; font-size: 14px; letter-spacing: 0.01em; color: var(--ink); margin-right: 4px; }
  #search {
    flex: 0 1 320px; min-width: 0; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line);
    font-size: 13px; background: var(--surface); color: var(--ink);
  }
  #search::placeholder { color: var(--muted); }
  .toolbar-button {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 14px; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .toolbar-button:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-spacer { flex: 1; }
  .toolbar-hint { font-size: 12px; color: var(--muted); }

  #canvas-wrap { position: absolute; top: 52px; left: 0; right: 320px; bottom: 0; overflow: hidden; }
  svg#canvas {
    width: 100%; height: 100%; touch-action: none; cursor: grab; display: block;
    user-select: none; -webkit-user-select: none;
  }
  svg#canvas:active { cursor: grabbing; }

  .environment-frame { stroke-width: calc(1.5px * var(--inv-zoom)); stroke-dasharray: 3 5; }
  .environment-label { font: 500 calc(11px * var(--inv-zoom)) var(--sans); }

  .component-frame { stroke-width: calc(1.5px * var(--inv-zoom)); }
  .component-interior { stroke: none; }
  .component-label { font: 600 calc(11px * var(--inv-zoom)) var(--mono); fill: var(--ink); }
  .component-caption { font: calc(10.5px * var(--inv-zoom)) var(--sans); fill: var(--muted); }
  .component, .part, .external, .environment { cursor: pointer; }
  .component.dimmed, .part.dimmed, .external.dimmed, .edge.dimmed, .edge-label.dimmed, .edge-label-bg.dimmed { opacity: 0.14; }
  .component.selected .component-frame, .part.selected .part-frame { stroke-width: calc(2.5px * var(--inv-zoom)); }
  .component.search-match .component-frame, .part.search-match .part-frame {
    stroke-width: calc(2.5px * var(--inv-zoom)); stroke: var(--ink);
  }

  .part-frame { fill: var(--paper); stroke: var(--line); stroke-width: calc(1.25px * var(--inv-zoom)); }
  .part-label { font: calc(10.5px * var(--inv-zoom)) var(--mono); fill: var(--ink); text-anchor: middle; }

  .external-shape {
    fill: var(--panel); stroke: var(--muted); stroke-width: calc(1.5px * var(--inv-zoom)); stroke-dasharray: 2 4;
  }
  .external-label { font: calc(10.5px * var(--inv-zoom)) var(--mono); fill: var(--muted); text-anchor: middle; }

  .diagraph-arrow-path { fill: var(--muted); }
  /* Markers don't inherit the referencing path's opacity, so the arrowhead
     needs its own pre-dimmed variant swapped in via marker-end. */
  .edge { stroke: var(--muted); stroke-width: calc(1.5px * var(--inv-zoom)); fill: none; marker-end: url(#diagraph-arrow); }
  .edge.dimmed { marker-end: url(#diagraph-arrow-dim); }
  .edge.cross-env { stroke-dasharray: 7 5; }
  .edge-part-internal { stroke-width: calc(1.25px * var(--inv-zoom)); }
  .edge-label { font: calc(10px * var(--inv-zoom)) var(--mono); fill: var(--muted); text-anchor: middle; }
  .edge-label-bg { fill: var(--panel); stroke: var(--line); stroke-width: calc(1px * var(--inv-zoom)); rx: 3px; }
  .edge-label-group { cursor: grab; }
  .edge-label-group:active { cursor: grabbing; }

  .resize-handle { fill: transparent; stroke: none; cursor: nwse-resize; }
  .resize-handle-glyph { stroke: var(--muted); stroke-width: calc(1.25px * var(--inv-zoom)); opacity: 0; pointer-events: none; }
  .component:hover .resize-handle-glyph, .part:hover .resize-handle-glyph,
  .environment:hover .resize-handle-glyph { opacity: 0.6; }

  #inspector {
    position: absolute; top: 52px; right: 0; bottom: 0; width: 320px; z-index: 15;
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 18px 18px 18px; overflow-y: auto;
  }
  .inspector-empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .inspector-heading { margin-bottom: 14px; }
  .inspector-name { font: 600 15px var(--mono); word-break: break-word; }
  .inspector-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .inspector-section {
    font: 500 11px var(--sans); color: var(--muted); margin: 16px 0 8px;
    padding-top: 12px; border-top: 1px solid var(--line);
  }
  .inspector-section:first-of-type { border-top: none; padding-top: 0; }
  .inspector-chip {
    display: inline-block; margin: 0 6px 6px 0; padding: 4px 9px; font: 12px var(--mono);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; color: var(--ink);
  }
  .inspector-chip:hover { border-color: var(--accent); color: var(--accent); }
  .inspector-edge { display: flex; align-items: baseline; gap: 6px; font-size: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .inspector-edge-arrow { color: var(--accent); }
  .inspector-link {
    font: 12px var(--mono); background: none; border: none; padding: 0; cursor: pointer;
    color: var(--ink); text-decoration: underline; text-decoration-color: var(--line);
  }
  .inspector-link:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .inspector-edge-label { color: var(--muted); font-size: 11px; }

  #legend {
    position: absolute; left: 16px; bottom: 16px; z-index: 15;
    background: var(--legend-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; line-height: 1.7; color: var(--muted);
    max-width: 240px;
  }
  .legend-row { display: flex; align-items: center; gap: 7px; }
  .legend-swatch { width: 11px; height: 11px; flex: none; }
  .legend-swatch-env { border-radius: 50%; background: var(--swatch-color); }
  .legend-swatch-component { border-radius: 3px; background: var(--muted); opacity: 0.5; }
  .legend-swatch-part { border-radius: 2px; border: 1px solid var(--muted); }
  .legend-swatch-external { background: var(--panel); border: 1.5px dashed var(--muted); transform: rotate(45deg); }
  .legend-swatch-dashed { border-top: 1.5px dashed var(--muted); height: 0; align-self: center; }

  #empty-state {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; color: var(--muted); text-align: center; padding: 24px;
  }
  #empty-state strong { color: var(--ink); font-size: 15px; font-weight: 600; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 760px) {
    #inspector { display: none; }
    #canvas-wrap { right: 0; }
    #search { flex-basis: 120px; }
    .toolbar-hint { display: none; }
    #toolbar { padding: 0 10px; gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span id="brand">diagraph</span>
      <input id="search" type="search" placeholder="Filter components, parts, externals…">
      <span class="toolbar-hint">scroll to zoom · drag to pan · double-click to step in</span>
      <span class="toolbar-spacer"></span>
      <button id="theme-toggle" class="toolbar-button" type="button">Dark</button>
      <button id="fit-view" class="toolbar-button" type="button">Fit view</button>
    </div>
    <div id="canvas-wrap">
      <svg id="canvas">
        <defs>
          <marker id="diagraph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="diagraph-arrow-path" d="M0,0 L10,5 L0,10 z"></path>
          </marker>
          <marker id="diagraph-arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="diagraph-arrow-path" d="M0,0 L10,5 L0,10 z" opacity="0.14"></path>
          </marker>
        </defs>
        <g id="viewport"></g>
      </svg>
      <div id="empty-state">
        <strong>No components found</strong>
        <span>Add a diagram.toml to a directory in this monorepo to see it here.</span>
      </div>
    </div>
    <aside id="inspector">
      <div id="inspector-body"></div>
    </aside>
    <div id="legend">
      <div id="legend-body"></div>
    </div>
  </div>
  <script type="application/json" id="diagraph-data">__DIAGRAPH_DATA__</script>
  <script>__DIAGRAPH_SCRIPT__</script>
</body>
</html>
