environment = "cloud"

[parts.query-handler]
[[parts.query-handler.edges]]
target = "rate-limiter"
via = "in-process call"
data = "request throttle check"
[[parts.query-handler.edges]]
target = "cache-reader"
via = "in-process call"
data = "stock lookup"

[parts.rate-limiter]

[parts.cache-reader]
[[parts.cache-reader.edges]]
target = "cache-writer"
via = "channel"
data = "cache miss backfill"

[parts.cache-writer]
[[parts.cache-writer.edges]]
target = "event-publisher"
via = "channel"
data = "stock change event"

[parts.event-publisher]

[parts.sync-worker]
[[parts.sync-worker.edges]]
target = "cache-writer"
via = "channel"
data = "cache invalidation"
[[parts.sync-worker.edges]]
target = "stock-reconciler"
via = "channel"
data = "restock confirmation"

[parts.stock-reconciler]
[[parts.stock-reconciler.edges]]
target = "cache-writer"
via = "channel"
data = "reconciled stock levels"
[[parts.stock-reconciler.edges]]
target = "audit-logger"
via = "channel"
data = "reconciliation record"

[parts.audit-logger]

[[edges]]
target = "warehouse-gateway"
via = "MQTT"
data = "restock trigger"
from_part = "sync-worker"
