environment = "edge"

[parts.mqtt-listener]
[[parts.mqtt-listener.edges]]
target = "dedup-worker"
via = "channel"
data = "raw telemetry"

[parts.dedup-worker]
[[parts.dedup-worker.edges]]
target = "forwarder"
via = "channel"
data = "deduplicated telemetry"

[parts.forwarder]

[[edges]]
target = "inventory-service"
via = "webhook"
data = "shipment confirmation"
from_part = "forwarder"
to_part = "query-handler"
