[package]
name = "diagraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Declare which components in your monorepo talk to which, and render static + interactive architecture diagrams."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pngouin/diagraph"
readme = "README.md"
keywords = ["diagram", "architecture", "monorepo", "graphviz", "cli"]
categories = ["command-line-utilities", "visualization", "development-tools"]

[[bin]]
name = "diagraph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"
walkdir = "2.5.0"
